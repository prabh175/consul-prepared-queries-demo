# Consul dual-DC dnsmasq configuration.
# Install on any client VM that needs resilient .consul DNS resolution.
# Path: /etc/dnsmasq.d/consul-dual-dc.conf
#
# Replace DC3_CONSUL_EIP and DC4_CONSUL_EIP with the Elastic IP outputs from:
#   terraform -chdir=terraform/dc3 output -raw consul_dns_endpoint
#   terraform -chdir=terraform/dc4 output -raw consul_dns_endpoint
#
# Behaviour: dnsmasq queries BOTH Consul servers in parallel (all-servers mode).
# Whichever DC's control plane is alive responds first — zero timeout wait.
# If DC3 goes down: DC4 answers immediately using its mirrored copy of the query.
# If DC4 goes down: DC3 answers as normal.
#
# Note: this file is for clients that do NOT run a local Consul agent.
# HashiCups VMs in DC3 already have a local agent — they resolve via 127.0.0.1:8600.

all-servers

# Forward all .consul queries to both DC3 and DC4 Consul DNS simultaneously.
server=/consul/DC3_CONSUL_EIP#8600
server=/consul/DC4_CONSUL_EIP#8600

# Prevent negative caching so a transient failure on one DC doesn't poison
# the local cache when the other DC is still healthy.
no-negcache
